[package]
name         = "annex-encoder"
description  = "VideoToolbox hardware encoder. CVPixelBuffer in, Annex-B NAL units out."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

# Wired in at M2.
[dependencies]
annex-core    = { workspace = true }
annex-capture = { workspace = true }
objc2         = { workspace = true }

objc2-core-foundation = { workspace = true, features = [
    "CFBase",
    "CFDictionary",
    "CFNumber",
    "CFString",
    "CFArray",
] }

objc2-core-media = { workspace = true, features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMTime",
    "CMBase",
] }

objc2-core-video = { workspace = true, features = [
    "CVPixelBuffer",
    "CVBuffer",
    "CVImageBuffer",
] }

objc2-video-toolbox = { version = "0.3.2", features = [
    "VTCompressionSession",
    "VTCompressionProperties",
    "VTSession",
    "VTErrors",
    "VTBase",
    "objc2-core-media",
    "objc2-core-video",
] }
