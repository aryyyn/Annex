name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Annex is LAN only by design: no STUN, no TURN, no relay, no account, and no data
        leaving your network. Requests that keep that model are the ones most likely to land.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that Annex does not let you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
  - type: dropdown
    id: scope
    attributes:
      label: Does this stay within the LAN-only scope
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: true
